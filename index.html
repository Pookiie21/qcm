<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aide-mémoire Shell</title>
<style>
:root{--bg:#fff;--text:#1f1e1d;--muted:#5f5e5a;--card:#f1efe8;--line:#d3d1c7;--accent:#185fa5}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--text:#f1efe8;--muted:#b4b2a9;--card:#2c2c2a;--line:#444441;--accent:#85b7eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:22px;font-weight:500;margin:0 0 .75rem}
h2{font-size:17px;font-weight:500;margin:1.5rem 0 .5rem;color:var(--accent)}
#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);position:sticky;top:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--card);width:46%;word-break:break-word}
.note{font-size:13px;color:var(--muted);margin:.4rem 0}
#none{display:none;color:var(--muted);padding:1rem 0}
</style>
</head>
<body>
<main>
<h1>Aide-mémoire Shell</h1>
<input id="q" type="search" placeholder="Rechercher une commande (ex : chmod, grep, cron...)" autofocus>
<div id="out"></div>
<p id="none">Aucun résultat.</p>
</main>

const out=document.getElementById('out'),none=document.getElementById('none'),q=document.getElementById('q');
D.forEach(([t,rows])=>{
  const s=document.createElement('section');
  const h=document.createElement('h2');h.textContent=t;s.appendChild(h);
  const tb=document.createElement('table');
  rows.forEach(([c,d])=>{
    const tr=document.createElement('tr');
    const a=document.createElement('td');a.textContent=c;
    const b=document.createElement('td');b.textContent=d;
    tr.appendChild(a);tr.appendChild(b);tb.appendChild(tr);
  });
  s.appendChild(tb);out.appendChild(s);
});
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  let any=false;
  out.querySelectorAll('section').forEach(s=>{
    let vis=0;
    s.querySelectorAll('tr').forEach(tr=>{
      const ok=!v||tr.textContent.toLowerCase().includes(v);
      tr.style.display=ok?'':'none';
      if(ok)vis++;
    });
    s.style.display=vis?'':'none';
    if(vis)any=true;
  });
  none.style.display=any?'none':'block';
});
</script>
